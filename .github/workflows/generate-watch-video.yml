name: Generate Watch Video

run-name: video-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID richiesta"
        required: true
        default: "manual"
        type: string

      mode:
        description: "Modalità"
        required: true
        default: "generate_video"
        type: choice
        options:
          - deploy_only
          - test_voice
          - generate_video

      script:
        description: "Script completo"
        required: false
        default: ""
        type: string

      hook:
        description: "Hook iniziale"
        required: false
        default: ""
        type: string

      voice:
        description: "Voce"
        required: true
        default: "it-IT-GiuseppeMultilingualNeural"
        type: choice
        options:
          - it-IT-GiuseppeMultilingualNeural

      rate:
        description: "Velocità voce"
        required: true
        default: "+6%"
        type: choice
        options:
          - "+0%"
          - "+4%"
          - "+6%"
          - "+8%"
          - "+10%"

      outro:
        description: "Testo finale"
        required: false
        default: ""
        type: string

      visual_queries:
        description: "Visual avanzati opzionali separati da virgola"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    concurrency:
      group: watch-video-generator
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Prepara Python
        if: ${{ inputs.mode != 'deploy_only' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        if: ${{ inputs.mode != 'deploy_only' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip -q
          pip install edge-tts==7.2.8 "requests>=2.32.0" -q

      - name: Genera contenuto
        if: ${{ inputs.mode != 'deploy_only' }}
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          MODE: ${{ inputs.mode }}
          SCRIPT: ${{ inputs.script }}
          HOOK: ${{ inputs.hook }}
          VOICE: ${{ inputs.voice }}
          RATE: ${{ inputs.rate }}
          OUTRO: ${{ inputs.outro }}
          VISUAL_QUERIES: ${{ inputs.visual_queries }}

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

        run: |
          python generate_video.py

      - name: Prepara sito
        run: |
          mkdir -p _site

          cp index.html _site/
          cp app.js _site/
          cp styles.css _site/
          cp manifest.json _site/
          cp icon.svg _site/

          if [ -d output ]; then
            cp -f output/* _site/ 2>/dev/null || true
          fi

          printf '{"request_id":"%s","mode":"%s","deployed":true}\n' \
          "${{ inputs.request_id }}" \
          "${{ inputs.mode }}" \
          > _site/deploy.json

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica file GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica webapp
        id: deployment
        uses: actions/deploy-pages@v4
